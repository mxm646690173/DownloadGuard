plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spoof.downloadguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.spoof.downloadguard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
