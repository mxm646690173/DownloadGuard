plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spoof.downloadguard'
    compileSdk 34

    defaultConfig {
        applicationId "com.spoof.downloadguard"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "2.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API 不在 Maven Central，jar 已 vendored 到 app/libs/
    compileOnly files('libs/api-82.jar')
}
