name: Build DownloadGuard LSPosed Module

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK platforms and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build unsigned APK
        run: gradle assembleRelease --no-daemon

      - name: Sign APK with debug key
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Debug,O=Debug,C=US" -keyalg RSA -keysize 2048 \
            -validity 10000 >/dev/null 2>&1
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | head -1)
          "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android \
            --out downloadguard.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          ls -la downloadguard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DownloadGuard-APK
          path: downloadguard.apk
