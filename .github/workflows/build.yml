name: Build DlGuard Zygisk Module

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .so for each ABI
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            echo "=== Building $ABI ==="
            cmake -S module/jni -B build/$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$ABI -j2
            mkdir -p out/zygisk
            cp build/$ABI/libdl_guard.so "out/zygisk/$ABI.so"
          done
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            nm -D "out/zygisk/$ABI.so" | grep -q "zygisk_module_entry" || {
              echo "::error::zygisk_module_entry missing in $ABI"; exit 1; }
          done

      - name: Assemble Magisk module zip
        run: |
          cd out
          cat > module.prop <<'EOF'
          id=dlguard_native
          name=下载根拦(Zygisk)
          version=1.0
          versionCode=1
          author=Claude
          description=网络层根源拦截APK下载：HTTP请求URL命中特征直接断开连接
          EOF
          cat > customize.sh <<'EOF'
          SKIPUNZIP=1
          ui_print "- DlGuard Zygisk 下载根拦"
          unzip -o "$ZIPFILE" -x "META-INF/*" -d "$MODPATH" >/dev/null
          set_perm_recursive "$MODPATH" 0 0 0755 0644
          EOF
          mkdir -p META-INF/com/google/android
          printf '#MAGISK\n' > META-INF/com/google/android/updater-script
          cp ../module/update-binary META-INF/com/google/android/update-binary
          zip -r ../DlGuard-Zygisk.zip . -x '*.DS_Store'
          cd ..
          unzip -l DlGuard-Zygisk.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DlGuard-Zygisk
          path: DlGuard-Zygisk.zip
